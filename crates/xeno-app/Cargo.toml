[package]
name = "xeno-app"
description = "Xenobots / Ultrabots reimplementation: the game binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
softbuffer = "0.4"
winit = "0.30"
xeno-audio = { path = "../xeno-audio" }
xeno-formats = { path = "../xeno-formats" }
xeno-render = { path = "../xeno-render" }
xeno-sim = { path = "../xeno-sim" }

[dev-dependencies]
xeno-formats = { path = "../xeno-formats", features = ["test-fixtures"] }
